name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package module
        run: zip -r oplus-gms-ebpf-unlock.zip module.prop customize.sh service.sh bpftool

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: oplus-gms-ebpf-unlock.zip
          generate_release_notes: true
